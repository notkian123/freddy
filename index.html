<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #click-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            cursor: pointer;
            z-index: 10;
        }
        img {
            max-width: 100vw;
            max-height: 100vh;
            display: none;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="click-layer" onclick="startGriddy()"></div>
    <img id="freddy-gif" src="freddy-griddy.gif" alt="">
    <audio id="fnaf-audio" src="har-har-har.mp3" loop></audio>
    <script>
        function startGriddy() {
            document.getElementById('click-layer').style.display = 'none';
            document.getElementById('freddy-gif').style.display = 'block';
            const audio = document.getElementById('fnaf-audio');
            audio.play().catch(error => { console.log("Audio blocked:", error); });
        }
    </script>
</body>
</html>
